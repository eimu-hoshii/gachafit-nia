    // ==================== Web Audio & Web Speech API 制御 ====================
    class SoundAndSpeech {
      constructor() {
        this.audioCtx = null;
      }
      initAudio() {
        if (!this.audioCtx && typeof window !== 'undefined') {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.audioCtx = new AC();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      }
      vibrate(pattern = [200, 100, 200]) {
        if (navigator.vibrate) {
          try { navigator.vibrate(pattern); } catch {}
        }
      }
      playTone(freq = 880, duration = 0.12, type = 'sine', gainVal = 0.18, delay = 0) {
        try {
          this.initAudio();
          if (!this.audioCtx) return;
          const now = this.audioCtx.currentTime + delay;
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch {}
      }
      playGachaTick(step = 0) {
        const freqs = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
        this.playTone(freqs[step % freqs.length], 0.06, 'triangle', 0.12);
      }
      playGachaReveal() {
        this.playTone(523.25, 0.1, 'triangle', 0.18, 0);
        this.playTone(659.25, 0.1, 'triangle', 0.18, 0.08);
        this.playTone(783.99, 0.12, 'triangle', 0.2, 0.16);
        this.playTone(1046.5, 0.28, 'sine', 0.24, 0.25);
        this.vibrate([80, 50, 120]);
      }
      playSetDone() {
        this.playTone(659.25, 0.09, 'sine', 0.2, 0);
        this.playTone(880, 0.18, 'sine', 0.22, 0.09);
        this.vibrate([100]);
      }
      playCountdownAlert(sec) {
        if (sec === 10) {
          this.playTone(784, 0.12, 'square', 0.15, 0);
          this.playTone(784, 0.12, 'square', 0.15, 0.16);
          this.vibrate([200, 100, 200]);
        } else if (sec === 5) {
          this.playTone(880, 0.14, 'sawtooth', 0.16, 0);
          this.vibrate([200, 100, 200]);
        } else if (sec <= 3 && sec > 0) {
          this.playTone(880, 0.1, 'sine', 0.15, 0);
        } else if (sec === 0) {
          this.playTone(1046.5, 0.15, 'triangle', 0.25, 0);
          this.playTone(1318.5, 0.35, 'triangle', 0.28, 0.14);
          this.vibrate([200, 100, 200]);
        }
      }
      playWorkoutComplete() {
        [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((n, i) => {
          this.playTone(n, i === 5 ? 0.45 : 0.11, 'triangle', 0.22, i * 0.11);
        });
        this.vibrate([200, 100, 200, 100, 350]);
      }
      speak(text, enabled = true) {
        if (!enabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text.replace(/[🟡🔴🔵🟢⚫📐🏋️🔥⚡]/gu, ''));
          utter.lang = 'ja-JP';
          utter.pitch = 1.25;
          utter.rate = 1.12;
          window.speechSynthesis.speak(utter);
        } catch {}
      }
    }

                      <path d="M48 126 L92 126 L90 144 L72 144 L70 137 L68 144 L50 144 Z" fill="#F8FAFC" />
                      <rect x="46" y="18" width="48" height="50" rx="22" fill="#B57B5B" />
                      <path d="M43 40 C42 15, 58 10, 70 10 C82 10, 98 15, 97 40 C90 28, 82 36, 70 42 C58 36, 50 28, 43 40 Z" fill="#18161D" />
                      <ellipse cx="59" cy="46" rx="5.5" ry="6" fill="#FFFFFF" />
                      <circle cx="59" cy="47" r="4" fill="#BE123C" />
                      <ellipse cx="81" cy="46" rx="5.5" ry="6" fill="#FFFFFF" />
                      <circle cx="81" cy="47" r="4" fill="#BE123C" />
                      <line x1="66" y1="58" x2="74" y2="58" stroke="#7F1D1D" strokeWidth="2" strokeLinecap="round" />
                    </svg>
                  )}
                  <div className="absolute inset-x-0 bottom-0 bg-black/75 px-1.5 py-0.5 text-center text-[10px] font-black text-rose-400">
                    NIA
                  </div>
                </div>
              )}
            </div>

            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2 mb-1.5">
                <div className="flex items-center gap-1.5">
                  <span className="px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-rose-600/20 text-rose-400 border border-rose-500/30">
                    🔥 専属トレーナー ニア
                  </span>
                  {mode === 'chibi' && intervalRemaining !== null && (
                    <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-400/40 animate-pulse">
                      ⏱️ 残り{intervalRemaining}秒
                    </span>
                  )}
                </div>
                <div className="flex items-center gap-1">
                  <button
                    type="button"
                    onClick={onReplayVoice}
                    className="px-2 py-1 rounded-lg bg-zinc-800 text-zinc-200 text-[11px] font-bold border border-zinc-700"
                  >
                    🔊 再生
                  </button>
                  <button
                    type="button"
                    onClick={onToggleVoice}
                    className={`px-2 py-1 rounded-lg border text-[11px] font-bold ${
                      voiceEnabled
                        ? 'bg-rose-600/20 border-rose-500/50 text-rose-300'
                        : 'bg-zinc-800 border-zinc-700 text-zinc-500'
                    }`}
                  >
                    {voiceEnabled ? '音声ON' : '音声OFF'}
                  </button>
                </div>
              </div>
              <div className="rounded-xl bg-zinc-950/90 border border-zinc-800 p-3">
                <p className="text-xs sm:text-sm font-bold leading-relaxed text-zinc-100">
                  「{dialogue}」
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== 器具セッティングUIカード ====================
    function GearVisualizer({ exercise }) {
      if (!exercise) return null;
      const { bench_angle, gear_setting, setup_detail } = exercise;
      const matchedTubes = TUBE_PRESETS.filter(t => gear_setting.includes(t.name) || gear_setting.includes(t.emoji));
      const matchedDumbbells = DUMBBELL_PRESETS.filter(d => gear_setting.includes(d.weight));

      return (
        <div className="rounded-2xl bg-[#151520] border border-zinc-800 p-3.5 space-y-3 shadow-lg">
          <div className="text-[11px] font-black uppercase tracking-wider text-rose-400">
            ⚡ 器具セッティング・クイックガイド
          </div>
          <div className="grid grid-cols-2 gap-2.5">
            <div className="rounded-xl bg-zinc-900 border border-zinc-800 p-2.5">
              <div className="text-[11px] text-zinc-400 font-bold">📐 ベンチ角度・位置</div>
              <div className="text-xs font-black text-amber-300 mt-0.5">{bench_angle}</div>
            </div>
            <div className="rounded-xl bg-zinc-900 border border-zinc-800 p-2.5">
              <div className="text-[11px] text-zinc-400 font-bold">🏋️ 使用ギア・重量</div>
              <div className="text-xs font-black text-white mt-0.5">{gear_setting}</div>
            </div>
          </div>

          {matchedTubes.length > 0 && (
            <div className="flex flex-wrap items-center gap-2">
              {matchedTubes.map(t => (
                <span key={t.id} className={`px-2.5 py-1 rounded-full text-xs font-extrabold border ${t.badgeClass}`}>
                  {t.emoji} {t.name} ({t.kg} / {t.lbs})
                </span>
              ))}
            </div>
          )}

          {matchedDumbbells.length > 0 && (
            <div className="flex flex-wrap gap-2">
              {matchedDumbbells.map(d => (
                <div key={d.weight} className="flex items-center gap-2 bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs">
                  <span className={`px-2 py-0.5 rounded font-black text-white bg-gradient-to-r ${d.color}`}>
                    片手 {d.weight}
                  </span>
                  <span className="text-zinc-300 font-bold">各側: {d.platesPerSide.join(' + ')}</span>
                </div>
              ))}
            </div>
          )}

          <div className="rounded-xl bg-rose-950/25 border border-rose-500/30 px-3 py-2 text-xs font-bold text-zinc-200">
            🔧 SETUP: {setup_detail}
          </div>
        </div>
      );
    }

    // ==================== メインアプリコンポーネント ====================
    function App() {
      const STORAGE_KEY = 'gachafit_nia_state_v1';
      const getDateKey = (d = new Date()) =>
        `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      const [savedState, setSavedState] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch {}
        return { history: {}, voiceEnabled: true, menuCount: 4, customExercises: null };
      });

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState)); } catch {}
      }, [savedState]);

      const exercisesMaster = savedState.customExercises || DEFAULT_EXERCISES;
      const [activeTab, setActiveTab] = useState('home');
      const [gachaMode, setGachaMode] = useState('all');
      const [isSpinning, setIsSpinning] = useState(false);
      const [todaysMenu, setTodaysMenu] = useState([]);
      const [niaDialogue, setNiaDialogue] = useState(NIA_LINES.boot);

      const [currentExIndex, setCurrentExIndex] = useState(0);
      const [currentSet, setCurrentSet] = useState(1);
      const [isInterval, setIsInterval] = useState(false);
      const [intervalSecLeft, setIntervalSecLeft] = useState(0);
      const [intervalTotalSec, setIntervalTotalSec] = useState(90);
      const [workoutFinished, setWorkoutFinished] = useState(false);

      const say = (line) => {
        setNiaDialogue(line);
        soundManager.speak(line, savedState.voiceEnabled);
      };

      const rollGacha = (reroll = false) => {
        if (isSpinning) return;
        soundManager.initAudio();
        const pool = gachaMode === 'all' ? exercisesMaster : exercisesMaster.filter(e => e.category === gachaMode);
        const count = Math.min(savedState.menuCount || 4, pool.length);
        setIsSpinning(true);
        setWorkoutFinished(false);

        let tick = 0;
        const iv = setInterval(() => {
          tick += 1;
          soundManager.playGachaTick(tick);
          if (tick >= 7) {
            clearInterval(iv);
            const picked = [...pool].sort(() => Math.random() - 0.5).slice(0, count);
            setTodaysMenu(picked);
            setIsSpinning(false);
            setCurrentExIndex(0);
            setCurrentSet(1);
            setIsInterval(false);
            soundManager.playGachaReveal();
            say(reroll ? NIA_LINES.gachaReroll : NIA_LINES.gachaReady);
          }
        }, 85);
      };

      useEffect(() => {
        if (!isInterval) return;
        const iv = setInterval(() => {
          setIntervalSecLeft(prev => {
            const next = prev - 1;
            if (next === 10) {
              soundManager.playCountdownAlert(10);
              say(NIA_LINES.interval10Sec);
            } else if (next === 5) {
              soundManager.playCountdownAlert(5);
              setNiaDialogue(NIA_LINES.interval5Sec);
            } else if (next <= 0) {
              clearInterval(iv);
              soundManager.playCountdownAlert(0);
              advanceAfterInterval();
              return 0;
            }
            return next;
          });
        }, 1000);
        return () => clearInterval(iv);
      }, [isInterval, currentExIndex, currentSet, todaysMenu]);

      const advanceAfterInterval = () => {
        setIsInterval(false);
        const ex = todaysMenu[currentExIndex];
        if (!ex) return;
        if (currentSet < ex.sets) {
          setCurrentSet(s => s + 1);
          say(NIA_LINES.activeSet);
        } else if (currentExIndex < todaysMenu.length - 1) {
          const nextEx = todaysMenu[currentExIndex + 1];
          setCurrentExIndex(i => i + 1);
          setCurrentSet(1);
          say(`次は「${nextEx.name}」よ！${NIA_LINES.activeSet}`);
        }
      };

      const handleCompleteSet = () => {
        const ex = todaysMenu[currentExIndex];
        if (!ex) return;
        if (currentSet >= ex.sets && currentExIndex >= todaysMenu.length - 1) {
          setIsInterval(false);
          setWorkoutFinished(true);
          soundManager.playWorkoutComplete();
          const todayKey = getDateKey();
          setSavedState(prev => ({
            ...prev,
            history: {
              ...(prev.history || {}),
              [todayKey]: { completedAt: new Date().toISOString(), exercises: todaysMenu }
            }
          }));
          say(NIA_LINES.complete);
          return;
        }
        soundManager.playSetDone();
        setIntervalTotalSec(ex.interval_sec || 90);
        setIntervalSecLeft(ex.interval_sec || 90);
        setIsInterval(true);
        say(NIA_LINES.intervalStart);
      };

      const currentExercise = todaysMenu[currentExIndex];
      const totalDays = Object.keys(savedState.history || {}).length;

      return (
        <div className="min-h-screen bg-[#0B0B10] text-zinc-100 pb-24 max-w-md mx-auto">
          <header className="sticky top-0 z-30 backdrop-blur-xl bg-[#0B0B10]/90 border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
            <div>
              <h1 className="text-base font-black text-white">GachaFit <span className="text-xs text-rose-400">with ニア</span></h1>
              <p className="text-[10px] text-zinc-400">1タップ自宅トレ（胸・肩・腕・背中）</p>
            </div>
            <div className="px-3 py-1 rounded-xl bg-zinc-900 border border-zinc-800 text-xs font-black text-orange-400">
              🔥 累計 {totalDays} 日達成
            </div>
          </header>

          <main className="px-4 pt-3 space-y-4">
            <NiaAvatar
              mode={activeTab === 'workout' && isInterval ? 'chibi' : 'standing'}
              dialogue={niaDialogue}
              voiceEnabled={savedState.voiceEnabled}
              onToggleVoice={() => setSavedState(p => ({ ...p, voiceEnabled: !p.voiceEnabled }))}
              onReplayVoice={() => soundManager.speak(niaDialogue, true)}
              intervalRemaining={isInterval ? intervalSecLeft : null}
            />

            {activeTab === 'home' && (
              <div className="space-y-4">
                <div className="rounded-2xl bg-[#151520] border border-zinc-800 p-3.5 space-y-3">
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: 'push', title: 'Push', sub: '胸・肩前・三頭' },
                      { id: 'pull', title: 'Pull', sub: '背中・二頭・肩後' },
                      { id: 'all', title: 'オールスター', sub: '全11種目から抽選' }
                    ].map(m => (
                      <button
                        key={m.id}
                        onClick={() => setGachaMode(m.id)}
                        className={`p-2.5 rounded-xl border text-left ${
                          gachaMode === m.id ? 'bg-rose-600/25 border-rose-500 text-white' : 'bg-zinc-900 border-zinc-800 text-zinc-400'
                        }`}
                      >
                        <div className="text-xs font-black">{m.title}</div>
                        <div className="text-[10px] text-zinc-400">{m.sub}</div>
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => rollGacha(false)}
                      className="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-rose-600 to-purple-600 text-white font-black text-sm shadow-lg"
                    >
                      🎰 今日のメニューを生成（1タップ）
                    </button>
                    {todaysMenu.length > 0 && (
                      <button
                        onClick={() => rollGacha(true)}
                        className="px-3.5 py-3.5 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-bold"
                      >
                        🔄 リロール
                      </button>
                    )}
                  </div>
                </div>

                {todaysMenu.map((ex, idx) => (
                  <div key={ex.id} className="rounded-2xl bg-[#151520] border border-zinc-800 p-3.5 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-rose-400">#{idx + 1} {ex.target}</span>
                      <span className="text-xs font-bold text-zinc-300">{ex.sets}セット × {ex.reps}</span>
                    </div>
                    <div className="text-sm font-black text-white">{ex.name}</div>
                    <div className="flex flex-wrap gap-2 text-xs">
                      <span className="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 font-bold">📐 {ex.bench_angle}</span>
                      <span className="px-2 py-0.5 rounded bg-zinc-900 text-zinc-200 font-bold">🏋️ {ex.gear_setting}</span>
                    </div>
                  </div>
                ))}

                {todaysMenu.length > 0 && (
                  <button
                    onClick={() => { setActiveTab('workout'); say(NIA_LINES.activeSet); }}
                    className="w-full py-4 rounded-2xl bg-emerald-500 text-zinc-950 font-black text-base"
                  >
                    ▶️ このメニューでワークアウト開始！
                  </button>
                )}
              </div>
            )}

            {activeTab === 'workout' && currentExercise && !workoutFinished && (
              <div className="space-y-4">
                <div className="rounded-2xl bg-[#151520] border border-zinc-800 p-4 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-rose-400">{currentExercise.target}</span>
                    <span className="text-sm font-black text-white">セット {currentSet} / {currentExercise.sets}</span>
                  </div>
                  <h2 className="text-lg font-black text-white">{currentExercise.name}</h2>
                  <p className="text-xs text-amber-200 font-bold">💡 {currentExercise.tips}</p>
                </div>

                <GearVisualizer exercise={currentExercise} />

                {isInterval ? (
                  <div className="rounded-2xl bg-rose-950/50 border-2 border-rose-500 p-5 text-center space-y-3">
                    <div className="text-xs font-bold text-rose-300">インターバル残り時間</div>
                    <div className="text-5xl font-black text-white">{intervalSecLeft}秒</div>
                    <button
                      onClick={advanceAfterInterval}
                      className="w-full py-3 rounded-xl bg-rose-600 text-white font-black text-xs"
                    >
                      休憩をスキップして次セットへ
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={handleCompleteSet}
                    className="w-full py-5 rounded-2xl bg-gradient-to-r from-rose-600 to-purple-600 text-white font-black text-lg shadow-xl"
                  >
                    ✅ セット完了！（{currentSet}/{currentExercise.sets}）
                  </button>
                )}
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-[#0B0B10]/95 border-t border-zinc-800 p-2 grid grid-cols-2 gap-2">
            <button onClick={() => setActiveTab('home')} className={`py-2 rounded-xl text-xs font-black ${activeTab === 'home' ? 'bg-rose-600/20 text-rose-400' : 'text-zinc-400'}`}>
              🎰 ガチャ編成
            </button>
            <button onClick={() => setActiveTab('workout')} className={`py-2 rounded-xl text-xs font-black ${activeTab === 'workout' ? 'bg-rose-600/20 text-rose-400' : 'text-zinc-400'}`}>
              🏋️ ワークアウト実行
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
